<style>
  * { box-sizing: border-box; }
  body {

    display: flex;
    flex-direction: column;
    align-items: center;
  }
  button { font: inherit; }

  /* 顶部极简说明 */
  .preview-top-tip {
    margin: 0.9rem 0 0.4rem;
    background: rgba(7, 22, 56, 0.88);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 0.4rem 1.1rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;

  }

  .ref-toggle-bar {
    margin-bottom: 0.3rem;
  }
  .ref-toggle-btn {
    border: 1px solid rgba(7, 22, 56, 0.2);

    color: #071638;
    padding: 0.32rem 0.85rem;

    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);

  /* 居中的高仿真手机外壳 412 x 870 */
  .preview-stage {
    margin: 0.4rem auto 1.5rem;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 2rem;
    padding: 0 1rem;

  .phone-mockup {
    width: 412px;
    height: 870px;
    background: #edf2f9;
    border-radius: 42px;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 0 24px 60px rgba(7, 22, 56, 0.28), 0 0 0 11px #1e293b, 0 0 0 13px #94a3b8;
    display: flex;
    flex-direction: column;
    position: relative;
    scroll-behavior: smooth;
  }

  .phone-mockup::-webkit-scrollbar {
    width: 4px;
  }
  .phone-mockup::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.15);
    border-radius: 4px;
  }

  /* 手机顶部原生状态栏 */
  .phone-status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.4rem 0.25rem;
    font-size: 0.8rem;
    font-weight: 750;
    color: #0f172a;
    position: sticky;
    top: 0;
    z-index: 60;
    background: rgba(233, 242, 251, 0.96);
    backdrop-filter: blur(8px);
  }
  .phone-status-bar.is-transparent {
    background: transparent;
  }
  .status-icons {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  /* 页面容器淡入 */
  .screen-page {
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 100%;
    animation: fadeIn 0.16s ease-out;
  }
  .screen-page.is-active {
    display: flex;
  }
  @keyframes fadeIn {
    from { opacity: 0.88; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 屏幕内原生吸�?TabBar：全页面统一吸底，纯屏幕内原生按�?*/
  .native-tabbar {
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    border-top: 1px solid rgba(7, 22, 56, 0.08);
    box-shadow: 0 -4px 16px rgba(7, 22, 56, 0.05);
    padding: 0.35rem 0.5rem calc(0.35rem + env(safe-area-inset-bottom));
  }
  .native-tabbar button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.2rem;
    padding: 0.4rem 0 0.3rem;
    border: 0;
    background: transparent;
    color: #64748b;
    font-size: 0.72rem;
    font-weight: 650;
    cursor: pointer;
    position: relative;
    transition: color 0.15s ease;
  }
  .native-tabbar button svg {
    width: 1.35rem;
    height: 1.35rem;
    stroke-width: 2;
    transition: transform 0.15s ease;
  }
  .native-tabbar button:active svg {
    transform: scale(0.9);
  }
  .native-tabbar button.is-active {
    color: #071638;
    font-weight: 850;
  }
  .native-tabbar button.is-active svg {
    stroke-width: 2.4;
  }

  /* 手绘不规则黄色激活椭圆底衬（还原设计图样式） */
  .native-tabbar .nav-blob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    background: #ffd525;
    border-radius: 46% 54% 50% 50% / 52% 48% 52% 48%;
    z-index: -1;
    box-shadow: 0 3px 8px rgba(255, 213, 37, 0.35);
  }

  /* 屏幕�?Toast */
  .in-screen-toast {
    position: absolute;
    top: 3.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(7, 22, 56, 0.92);
    color: #fff;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 750;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    pointer-events: none;
    animation: toastPop 0.18s ease-out;
  }
  @keyframes toastPop {
    from { opacity: 0; transform: translate(-50%, -8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  .reference-box {
    width: 412px;
    height: 870px;
    border-radius: 42px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(7, 22, 56, 0.22), 0 0 0 9px #ffd525;

    height: 100%;
    object-fit: cover;
  }

    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>
</head>

<script>
  let activePage = 'home';
  let curSlide = 0;

  function navTo(pageKey) {
    activePage = pageKey;

    // 1. 切换屏幕内对应页面容�?    ['home', 'order', 'order-detail', 'profile'].forEach(k => {
      const pageEl = document.getElementById('page-' + k);
      if (pageEl) {
        pageEl.classList.toggle('is-active', k === pageKey);
      }
    });

    // 2. 手机滚动条复位到顶部
    const phone = document.getElementById('phoneBody');
    if (phone) phone.scrollTop = 0;

    // 3. 更新底栏 4 �?Tab 按钮的高亮状态与黄色手绘椭圆激活块
    const tabs = {
      home: document.getElementById('tabBtnShop'),
      order: document.getElementById('tabBtnMenu'),
      'order-detail': document.getElementById('tabBtnOrder'),
      profile: document.getElementById('tabBtnProfile')
    };

    Object.entries(tabs).forEach(([k, btn]) => {
      if (!btn) return;
      const isTarget = (k === pageKey);
      btn.classList.toggle('is-active', isTarget);
      const blob = btn.querySelector('.nav-blob');
      if (blob) blob.style.display = isTarget ? 'block' : 'none';
    });
  }

  // 首页拍立得轮播切换函�?  function setSlide(index) {
    curSlide = (index + 3) % 3;
    const slides = [
      document.getElementById('slide-0'),
      document.getElementById('slide-1'),
      document.getElementById('slide-2')
    ];
    const dots = [
      document.getElementById('dot-0'),
      document.getElementById('dot-1'),
      document.getElementById('dot-2')
    ];

    slides.forEach((sl, idx) => {
      if (!sl) return;
      sl.classList.remove('is-center', 'is-left', 'is-right');
      const pos = idx === curSlide ? 'is-center' : (idx - curSlide + 3) % 3 === 1 ? 'is-right' : 'is-left';
      sl.classList.add(pos);
    });

    dots.forEach((dot, idx) => {
      if (!dot) return;
      dot.classList.toggle('is-active', idx === curSlide);
    });
  }

  function stepSlide(dir) {
    setSlide(curSlide + dir);
  }

  function showToast(text) {
    const toast = document.getElementById('screenToast');
    toast.innerText = text;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2200);
  }

  function triggerRefresh() {
    const btn = document.getElementById('refreshBtnInPage');
    btn.innerText = '正在刷新�?;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerText = '刷新处理结果';
      btn.disabled = false;
      showToast('已获取最新状态：制作�?· 取消申请待处�?);
    }, 500);
  }

  function openModal(type) {
    if (type === 'location') {
      alert('【位置信息与隐私说明】\n\n1. 仅用于堂食拥挤参考，选择堂食时辅助测算热度。\n2. 绝不持续后台跟踪。\n3. 拒绝授权依然可以正常下单。\n4. 随时清除记录，绝不影响或删除订单�?);
    } else {
      alert('【校园预约用餐说明】\n\n1. 请在预约的时段前往档口取餐。\n2. 餐品制作完成后展示取餐码，出示给档口阿姨核销。\n3. 接单前可直接取消，制作中需提交申请并等待档口确认。\n4. 饭后请将餐盘送回餐盘回收处�?);
    }
  }

  function toggleRef() {
    const box = document.getElementById('refBox');
    const btn = document.getElementById('refBtn');
    if (box.style.display === 'block') {
      box.style.display = 'none';
      btn.innerText = '对照设计稿原�?(photo/04)';
    } else {
      box.style.display = 'block';
      btn.innerText = '隐藏设计稿原�?;
    }
  }

  // 默认首屏进入真正做好的首�?(店铺轮播与推�?
  navTo('home');
</script>
