<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF6E3" />
    <title>食麦呼 · 统一应用</title>
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #FDF6E3;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        transition: opacity 300ms ease;
      }
      .app-splash--leaving { opacity: 0; pointer-events: none; }
      .app-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }
      .app-splash__icon {
        width: min(54vw, 264px);
        height: auto;
        display: block;
        filter: drop-shadow(0 12px 26px rgba(74, 42, 26, 0.12));
      }
      .app-splash__leaves { animation: splash-leaves-out 2000ms linear infinite; }
      .app-splash__leaf--left { animation: splash-leaf-left 2000ms linear infinite; opacity: 0; }
      .app-splash__leaf--right { animation: splash-leaf-right 2000ms linear infinite; opacity: 0; }
      .app-splash__leaf--center {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: splash-leaf-center 2000ms cubic-bezier(0.2, 0.9, 0.25, 1.08) infinite;
        opacity: 0;
      }
      .app-splash__caption {
        margin: 0;
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: clamp(13px, 3.6vw, 16px);
        letter-spacing: 0.38em;
        color: rgba(74, 42, 26, 0.62);
        animation: splash-caption 2000ms linear infinite;
      }
      @keyframes splash-leaves-out {
        0%, 62% { opacity: 1; }
        82%, 100% { opacity: 0; }
      }
      @keyframes splash-leaf-left {
        0% { opacity: 0; }
        18% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes splash-leaf-right {
        0%, 18% { opacity: 0; }
        36% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes splash-leaf-center {
        0%, 36% { opacity: 0; transform: scaleY(0.02); }
        44% { opacity: 1; transform: scaleY(0.5); }
        56% { opacity: 1; transform: scaleY(1.04); }
        62%, 100% { opacity: 1; transform: scaleY(1); }
      }
      @keyframes splash-caption {
        0%, 10% { opacity: 0; }
        26% { opacity: 1; }
        62% { opacity: 1; }
        82%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__leaves, .app-splash__caption { animation: none; opacity: 1; }
        .app-splash__leaf--left, .app-splash__leaf--right { animation: none; opacity: 1; }
        .app-splash__leaf--center { animation: none; opacity: 1; transform: scaleY(1); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" class="app-splash" role="status" aria-live="polite" aria-label="正在加载食麦呼">
      <div class="app-splash__inner">
        <svg class="app-splash__icon" viewBox="0 0 200 200" aria-hidden="true">
          <rect width="200" height="200" rx="45" fill="#FCE3B6" />
          <g stroke="#F0A22B" stroke-width="9" stroke-linecap="round">
            <line x1="136" y1="50" x2="147" y2="32" />
            <line x1="150" y1="55" x2="169" y2="42" />
          </g>
          <path
            d="M57.1 140.9 A55 55 0 1 1 86.4 156.2 C76 162 62 167 50 172 C54 162 55 151 57.1 140.9 Z"
            fill="#FDF6E3"
            stroke="#4A2A1A"
            stroke-width="9"
            stroke-linejoin="round"
          />
          <g class="app-splash__leaves">
            <g transform="translate(88 126) rotate(-50)">
              <g class="app-splash__leaf--left">
                <path d="M0 0 C-15 -10 -23 -27 0 -46 C23 -27 15 -10 0 0 Z" fill="#F0A22B" />
              </g>
            </g>
            <g transform="translate(108 126) rotate(44)">
              <g class="app-splash__leaf--right">
                <path d="M0 0 C-15 -10 -23 -27 0 -46 C23 -27 15 -10 0 0 Z" fill="#F0A22B" />
              </g>
            </g>
            <g transform="translate(99 94) rotate(45)">
              <g class="app-splash__leaf--center">
                <path d="M0 0 C-14 -9 -21 -24 0 -40 C21 -24 14 -9 0 0 Z" fill="#F0A22B" />
              </g>
            </g>
          </g>
        </svg>
        <p class="app-splash__caption">正在加载食麦呼</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
