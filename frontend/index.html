<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF6E3" />
    <title>食麦呼 · 统一应用</title>
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #FDF6E3;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        transition: opacity 300ms ease;
      }
      .app-splash--leaving { opacity: 0; pointer-events: none; }
      .app-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }
      .app-splash__icon {
        position: relative;
        width: min(54vw, 264px);
        filter: drop-shadow(0 12px 26px rgba(74, 42, 26, 0.12));
      }
      .app-splash__base {
        display: block;
        width: 100%;
        height: auto;
      }
      .app-splash__leaves {
        position: absolute;
        inset: 0;
        animation: splash-leaves-out 2000ms linear infinite;
      }
      .app-splash__leaf {
        position: absolute;
        display: block;
        height: auto;
      }
      .app-splash__leaf--left { animation: splash-leaf-left 2000ms linear infinite; opacity: 0; }
      .app-splash__leaf--right { animation: splash-leaf-right 2000ms linear infinite; opacity: 0; }
      .app-splash__leaf--center {
        transform-origin: 50% 100%;
        animation: splash-leaf-center 2000ms cubic-bezier(0.2, 0.9, 0.25, 1.08) infinite;
        opacity: 0;
      }
      .app-splash__caption {
        margin: 0;
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: clamp(13px, 3.6vw, 16px);
        letter-spacing: 0.38em;
        color: rgba(74, 42, 26, 0.62);
        animation: splash-caption 2000ms linear infinite;
      }
      @keyframes splash-leaves-out {
        0%, 62% { opacity: 1; }
        82%, 100% { opacity: 0; }
      }
      @keyframes splash-leaf-left {
        0% { opacity: 0; }
        18% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes splash-leaf-right {
        0%, 18% { opacity: 0; }
        36% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes splash-leaf-center {
        0%, 36% { opacity: 0; transform: scaleY(0.02); }
        44% { opacity: 1; transform: scaleY(0.5); }
        56% { opacity: 1; transform: scaleY(1.04); }
        62%, 100% { opacity: 1; transform: scaleY(1); }
      }
      @keyframes splash-caption {
        0%, 10% { opacity: 0; }
        26% { opacity: 1; }
        62% { opacity: 1; }
        82%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__leaves, .app-splash__caption { animation: none; opacity: 1; }
        .app-splash__leaf--left, .app-splash__leaf--right { animation: none; opacity: 1; }
        .app-splash__leaf--center { animation: none; opacity: 1; transform: scaleY(1); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" class="app-splash" role="status" aria-live="polite" aria-label="正在加载食麦呼">
      <div class="app-splash__inner">
        <div class="app-splash__icon" aria-hidden="true">
          <img class="app-splash__base" src="/splash/base.png" alt="" />
          <div class="app-splash__leaves">
            <img class="app-splash__leaf app-splash__leaf--left" src="/splash/leaf-left.png" alt="" style="left: 33.81%; top: 48.64%; width: 14.75%;" />
            <img class="app-splash__leaf app-splash__leaf--right" src="/splash/leaf-right.png" alt="" style="left: 48.25%; top: 49.76%; width: 18.58%;" />
            <img class="app-splash__leaf app-splash__leaf--center" src="/splash/leaf-center.png" alt="" style="left: 46.73%; top: 37.24%; width: 14.99%;" />
          </div>
        </div>
        <p class="app-splash__caption">正在加载食麦呼</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
